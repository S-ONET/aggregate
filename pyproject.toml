[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aggregate"
version = "0.1.0"
description = "Aggregate task atoms into an occupational task list, and evaluate the list"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Jenn Wang"}, {name = "Andy Haupt"}]
dependencies = [
    "openai>=1.0",
    "numpy>=1.26",
    "pyyaml>=6",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["aggregate*"]

[tool.setuptools.package-data]
aggregate = ["configs.yml", "prompts/**/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
